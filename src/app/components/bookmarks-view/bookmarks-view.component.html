<div class="container">
  <div class="header">
    <h1>Bookmarks manager</h1>
    <div class="header-actions">
    <a routerLink="/organize" class="cleanup-link" title="Organize bookmarks">Organize</a>
    <a routerLink="/cleanup" class="cleanup-link" title="Cleanup Center">Cleanup</a>
    <a routerLink="/settings" class="settings-link" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
        </path>
      </svg>
    </a>
    </div>
  </div>
  <app-search-box
    [query]="searchTerm()"
    [error]="searchError()"
    [chips]="searchChips()"
    [folders]="searchScopeFolders()"
    [scopeFolderId]="searchScopeFolderId()"
    [selectedCollectionName]="selectedSmartCollection()?.name"
    (searchTermChange)="search($event)"
    (scopeFolderIdChange)="setScope($event)"
    (chipRemove)="removeChip($event)"
    (canonicalize)="canonicalizeSearch()"
    (collectionCreate)="createCollection()"
    (collectionEdit)="editCollection()"
    (collectionUpdate)="updateCollection()"
    (collectionRename)="renameCollection()"
    (collectionDuplicate)="duplicateCollection()"
    (collectionDelete)="deleteCollection()">
  </app-search-box>
  <div class="tree-view">
    <app-tree-view
      [directories]="directories()"
    >
    </app-tree-view>
  </div>
  <div class="main-view">
    @defer (on immediate) {
      <app-list-view
        [items]="items()"
        [selectedItems]="selectedBookmarkIds()"
      ></app-list-view>
    } @placeholder {
      <div class="list-placeholder" role="status">Loading bookmarks…</div>
    }
    <app-bookmark-detail [selection]="selectedBookmarks()"></app-bookmark-detail>
  </div>
</div>
