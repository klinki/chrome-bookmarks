<app-folder-menu #rightClickMenu [folder]="selectedDirectory()"></app-folder-menu>
<div
  id="tree-container"
  #treeContainer
  role="tree"
  aria-label="Bookmark folders"
  (keydown)="onTreeKeydown($event)">
  @for (dir of directories(); track dir.id; let first = $first) {
    <app-tree-item
      [directory]="dir"
      [level]="0"
      [selectedItem]="selectedDirectory()"
      [focusable]="first && selectedDirectory() === null"
      [menu]="rightClickMenu.menu.menu"
      [menuComponent]="rightClickMenu"
    ></app-tree-item>
  }
</div>
